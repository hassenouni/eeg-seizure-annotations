name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "eeg-dataset-explorer @ git+https://github.com/hassenouni/eeg-dataset-explorer.git@v0.1.0"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m pytest
